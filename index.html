                    })()}

                    <Modal isOpen={isNewModalOpen} onClose={() => setIsNewModalOpen(false)} title="إنشاء طلب تحليل جديد">
                        <form onSubmit={handleCreateOrder} className="space-y-6">
                            <div className="flex gap-6 mb-2 border-b pb-4">
                                <label className="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" checked={orderMode === 'existing'} onChange={() => setOrderMode('existing')} className="w-4 h-4 text-primary" />
                                    <span className={`text-sm font-bold ${orderMode === 'existing' ? 'text-primary' : 'text-slate-500'}`}>مريض مسجل مسبقاً</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" checked={orderMode === 'new'} onChange={() => setOrderMode('new')} className="w-4 h-4 text-primary" />
                                    <span className={`text-sm font-bold ${orderMode === 'new' ? 'text-primary' : 'text-slate-500'}`}>تسجيل مريض جديد</span>
                                </label>
                            </div>

                            {orderMode === 'existing' ? (
                                <div>
                                    <select required className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-primary outline-none transition-all font-semibold" value={newOrderData.patientId} onChange={e => setNewOrderData({...newOrderData, patientId: e.target.value})}>
                                        <option value="" disabled>-- حدد المريض من القائمة --</option>
                                        {patients.map(p => (
                                            <option key={p.id} value={p.id}>{p.name} - ({p.id})</option>
                                        ))}
                                    </select>
                                </div>
                            ) : (
                                <div className="space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1.5">الاسم الكامل</label>
                                        <input required type="text" className="w-full p-2.5 bg-white border border-slate-300 rounded-lg outline-none focus:border-primary" value={newPatientData.name} onChange={e => setNewPatientData({...newPatientData, name: e.target.value})} placeholder="الاسم الكامل" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1.5">العمر</label>
                                            <input required type="number" min="1" max="150" className="w-full p-2.5 bg-white border border-slate-300 rounded-lg outline-none focus:border-primary" value={newPatientData.age} onChange={e => setNewPatientData({...newPatientData, age: e.target.value})} placeholder="سنوات" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1.5">الجنس</label>
                                            <select className="w-full p-2.5 bg-white border border-slate-300 rounded-lg outline-none focus:border-primary" value={newPatientData.gender} onChange={e => setNewPatientData({...newPatientData, gender: e.target.value})}>
                                                <option value="ذكر">ذكر</option>
                                                <option value="أنثى">أنثى</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1.5">رقم الهاتف (اختياري)</label>
                                            <input type="text" dir="ltr" className="w-full p-2.5 bg-white border border-slate-300 rounded-lg outline-none focus:border-primary" value={newPatientData.phone} onChange={e => setNewPatientData({...newPatientData, phone: e.target.value})} placeholder="07XXXXXXXXX" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1.5">البريد الإلكتروني (اختياري)</label>
                                            <input type="email" dir="ltr" className="w-full p-2.5 bg-white border border-slate-300 rounded-lg outline-none focus:border-primary" value={newPatientData.email} onChange={e => setNewPatientData({...newPatientData, email: e.target.value})} placeholder="email@example.com" />
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-2 flex justify-between items-center">
                                    <span>اختر الفحوصات المطلوبة</span>
                                    <span className="text-xs font-normal text-primary bg-blue-50 px-2 py-1 rounded-md">{newOrderData.selectedTests.length} تحليل محدد</span>
                                </label>
                                <div className="max-h-[220px] overflow-y-auto border border-slate-200 rounded-xl p-2 bg-slate-50 custom-scrollbar grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    {tests.map(test => (
                                        <label key={test.id} className={`flex items-center gap-3 p-3 rounded-lg border cursor-pointer transition-all ${newOrderData.selectedTests.includes(test.id) ? 'bg-blue-50 border-primary shadow-sm' : 'bg-white border-slate-200 hover:border-blue-300'}`}>
                                            <input type="checkbox" className="w-4 h-4 text-primary rounded border-slate-300 focus:ring-primary accent-primary" 
                                                checked={newOrderData.selectedTests.includes(test.id)} 
                                                onChange={() => toggleTestSelection(test.id)} 
                                            />
                                            <div className="flex-1">
                                                <p className="font-bold text-sm text-slate-800" dir="ltr">{test.name}</p>
                                                <p className="text-xs text-emerald-600 font-semibold mt-0.5">{test.price.toLocaleString()} د.ع</p>
                                            </div>
                                        </label>
                                    ))}
                                </div>
                            </div>

                            <div className="pt-4 border-t flex justify-between items-center">
                                <div className="text-sm">
                                    <span className="text-slate-500">إجمالي التكلفة:</span>
                                    <strong className="text-xl text-slate-800 mr-2 block sm:inline">
                                        {newOrderData.selectedTests.map(id => tests.find(t=>t.id===id)).reduce((sum,t) => sum + (t?t.price:0), 0).toLocaleString()} د.ع
                                    </strong>
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setIsNewModalOpen(false)} className="px-5 py-2.5 rounded-xl text-slate-600 font-semibold hover:bg-slate-100 transition-colors hidden sm:block">إلغاء</button>
                                    <button type="submit" disabled={newOrderData.selectedTests.length === 0 || (orderMode === 'existing' && !newOrderData.patientId)} className="px-6 py-2.5 bg-primary text-white font-bold rounded-xl hover:bg-blue-600 shadow-md shadow-blue-500/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                        تأكيد الطلب
                                    </button>
                                </div>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        };

        const AuthScreen = ({ setIsAuthenticated, labDetails, setLabDetails, adminPassword, setAdminPassword }) => {
            const [authStep, setAuthStep] = useState('login'); 
            const [identifier, setIdentifier] = useState('');
            const [password, setPassword] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [successMsg, setSuccessMsg] = useState('');
            
            // For Forgot Password
            const [forgotPhone, setForgotPhone] = useState('');
            const [sentCode, setSentCode] = useState('');
            const [enteredCode, setEnteredCode] = useState('');
            const [newPassword, setNewPassword] = useState('');

            // For First Time Registration
            const [regName, setRegName] = useState('');
            const [regPhone, setRegPhone] = useState('');
            const [regPassword, setRegPassword] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                setErrorMsg('');
                if ((identifier === labDetails.phone || identifier === labDetails.name || identifier === 'admin') && password === adminPassword) {
                    setIsAuthenticated(true);
                } else {
                    setErrorMsg('خطأ: اسم المختبر/رقم الهاتف أو الرقم السري غير صحيح.');
                }
            };

            const handleFirstTimeRegister = (e) => {
                e.preventDefault();
                setErrorMsg('');
                if (regName && regPhone && regPassword.length >= 6) {
                    setLabDetails(prev => ({ ...prev, name: regName, phone: regPhone }));
                    setAdminPassword(regPassword);
                    setIsAuthenticated(true);
                } else {
                    setErrorMsg('يرجى إكمال الحقول بشكل صحيح (الرقم السري 6 رموز على الأقل).');
                }
            };

            const handleSendCode = (e) => {
                e.preventDefault();
                setErrorMsg('');
                if (forgotPhone) {
                    const code = Math.floor(1000 + Math.random() * 9000).toString();
                    setSentCode(code);
                    console.log("Verification Code:", code);
                    setSuccessMsg(`تم إرسال رسالة نصية إلى هاتف ${forgotPhone}`);
                    setAuthStep('forgot_verify');
                } else {
                    setErrorMsg('يرجى إدخال رقم الهاتف.');
                }
            };

            const handleVerifyCode = (e) => {
                e.preventDefault();
                setErrorMsg('');
                if (enteredCode === sentCode) {
                    setSuccessMsg('تم التحقق من الكود بنجاح. يرجى إدخال الرقم السري الجديد.');
                    setAuthStep('forgot_new_password');
                } else {
                    setErrorMsg('كود التحقق غير صحيح. يرجى المحاولة مرة أخرى.');
                }
            };

            const handleSaveNewPassword = (e) => {
                e.preventDefault();
                setErrorMsg('');
                if (newPassword.length >= 6) {
                    setAdminPassword(newPassword);
                    setSuccessMsg('تم تغيير الرقم السري بنجاح! يمكنك الآن تسجيل الدخول.');
                    setAuthStep('login');
                    setPassword('');
                    setIdentifier(forgotPhone || labDetails.phone);
                } else {
                    setErrorMsg('الرقم السري يجب أن يكون 6 رموز على الأقل.');
                }
            };

            return (
                <div className="flex justify-center items-center min-h-screen bg-slate-900 p-4 fade-in">
                    <div className="bg-white p-8 rounded-3xl shadow-2xl border border-slate-100 max-w-md w-full transition-all">
                        <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center mx-auto mb-4 text-white text-2xl shadow-lg shadow-primary/30">
                            <i className="fas fa-microscope"></i>
                        </div>

                        {authStep === 'login' && (
                            <form onSubmit={handleLogin} className="fade-in">
                                <h3 className="text-2xl font-black mb-1 text-center text-slate-800">تسجيل الدخول للنظام</h3>
                                <p className="text-xs text-slate-500 mb-6 text-center">أدخل اسم المختبر أو رقم الهاتف والرقم السري للمتابعة.</p>
                                
                                {errorMsg && <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-xl border border-red-100 font-semibold text-center">{errorMsg}</div>}
                                {successMsg && <div className="mb-4 p-3 bg-emerald-50 text-emerald-600 text-sm rounded-xl border border-emerald-100 font-semibold text-center">{successMsg}</div>}

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">اسم المختبر أو رقم الهاتف</label>
                                        <input required type="text" placeholder={`مثال: ${labDetails.phone}`} className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:border-primary focus:bg-white outline-none transition-all text-left" dir="auto" value={identifier} onChange={e => setIdentifier(e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">الرقم السري</label>
                                        <input required type="password" placeholder="••••••••" className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:border-primary focus:bg-white outline-none transition-all" value={password} onChange={e => setPassword(e.target.value)} />
                                    </div>
                                </div>
                                
                                <div className="flex justify-between items-center mt-4">
                                    <button type="button" onClick={() => {setAuthStep('forgot_phone'); setErrorMsg(''); setSuccessMsg(''); setForgotPhone('');}} className="text-xs text-primary font-bold hover:underline">نسيت الرقم السري؟</button>
                                    <button type="button" onClick={() => {setAuthStep('register_first'); setErrorMsg(''); setSuccessMsg('');}} className="text-xs text-secondary font-bold hover:underline">تسجيل لأول مرة؟</button>
                                </div>

                                <button type="submit" className="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3.5 rounded-xl mt-6 transition-all shadow-lg shadow-blue-500/25 flex justify-center items-center gap-2">
                                    تسجيل الدخول <i className="fas fa-arrow-left mt-0.5"></i>
                                </button>
                            </form>
                        )}

                        {authStep === 'register_first' && (
                            <form onSubmit={handleFirstTimeRegister} className="fade-in">
                                <h3 className="text-xl font-black mb-1 text-center text-slate-800">تسجيل الدخول لأول مرة</h3>
                                <p className="text-xs text-slate-500 mb-6 text-center">قم بإعداد بيانات المختبر الأساسية والرقم السري لحسابك.</p>
                                
                                {errorMsg && <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-xl border border-red-100 font-semibold text-center">{errorMsg}</div>}

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">اسم المختبر</label>
                                        <input required type="text" placeholder="اسم المختبر الطبي" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-primary outline-none" value={regName} onChange={e => setRegName(e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">رقم الهاتف</label>
                                        <input required type="text" placeholder="07XXXXXXXXX" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-primary outline-none text-left" dir="ltr" value={regPhone} onChange={e => setRegPhone(e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">الرقم السري الجديد (6 رموز على الأقل)</label>
                                        <input required type="password" placeholder="••••••••" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-primary outline-none" value={regPassword} onChange={e => setRegPassword(e.target.value)} />
                                    </div>
                                </div>
                                
                                <button type="submit" className="w-full bg-success hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl mt-6 transition-all shadow-lg shadow-emerald-500/25">
                                    حفظ وبدء استخدام النظام
                                </button>
                                <button type="button" onClick={() => {setAuthStep('login'); setErrorMsg(''); setSuccessMsg('');}} className="w-full text-slate-500 font-bold py-3 mt-2 hover:text-slate-800 transition-colors text-xs">
                                    العودة لتسجيل الدخول
                                </button>
                            </form>
                        )}

                        {authStep === 'forgot_phone' && (
                            <form onSubmit={handleSendCode} className="fade-in">
                                <h3 className="text-xl font-bold mb-2 text-center text-slate-800">استعادة الرقم السري</h3>
                                <p className="text-sm text-slate-500 mb-6 text-center">أدخل رقم الهاتف لإرسال كود التحقق.</p>
                                
                                {errorMsg && <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 font-semibold text-center">{errorMsg}</div>}

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">رقم الهاتف</label>
                                        <input required type="text" placeholder="07XXXXXXXXX" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-primary outline-none text-left" dir="ltr" value={forgotPhone} onChange={e => setForgotPhone(e.target.value)} />
                                    </div>
                                </div>
                                
                                <button type="submit" className="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-xl mt-6 transition-all shadow-md">
                                    إرسال رمز التحقق
                                </button>
                                <button type="button" onClick={() => {setAuthStep('login'); setErrorMsg(''); setSuccessMsg('');}} className="w-full text-slate-500 font-bold py-3 mt-2 hover:text-slate-800 transition-colors">
                                    العودة لتسجيل الدخول
                                </button>
                            </form>
                        )}

                        {authStep === 'forgot_verify' && (
                            <form onSubmit={handleVerifyCode} className="fade-in">
                                <h3 className="text-xl font-bold mb-2 text-center text-slate-800">إدخال كود التحقق</h3>
                                <p className="text-sm text-slate-500 mb-6 text-center">أدخل الكود المرسل إلى هاتفك.</p>
                                
                                {successMsg && <div className="mb-4 p-3 bg-blue-50 text-blue-700 text-xs rounded-lg border border-blue-100 font-semibold text-center" dir="auto">{successMsg}</div>}
                                {errorMsg && <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 font-semibold text-center">{errorMsg}</div>}

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">كود التحقق (4 أرقام)</label>
                                        <input required type="text" maxLength="4" placeholder="XXXX" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-primary outline-none text-center text-xl tracking-widest font-bold" dir="ltr" value={enteredCode} onChange={e => setEnteredCode(e.target.value)} />
                                    </div>
                                </div>
                                
                                <button type="submit" className="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-xl mt-6 transition-all shadow-md">
                                    تحقق من الكود
                                </button>
                                <button type="button" onClick={() => {setAuthStep('forgot_phone'); setErrorMsg(''); setSuccessMsg('');}} className="w-full text-slate-500 font-bold py-3 mt-2 hover:text-slate-800 transition-colors">
                                    إعادة إرسال أو تغيير الرقم
                                </button>
                            </form>
                        )}

                        {authStep === 'forgot_new_password' && (
                            <form onSubmit={handleSaveNewPassword} className="fade-in">
                                <h3 className="text-xl font-bold mb-2 text-center text-slate-800">إنشاء رقم سري جديد</h3>
                                <p className="text-sm text-slate-500 mb-6 text-center">أدخل الرقم السري الجديد لحسابك.</p>
                                
                                {successMsg && <div className="mb-4 p-3 bg-emerald-50 text-emerald-600 text-sm rounded-lg border border-emerald-100 font-semibold text-center">{successMsg}</div>}
                                {errorMsg && <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 font-semibold text-center">{errorMsg}</div>}

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">الرقم السري الجديد</label>
                                        <input required type="password" placeholder="••••••••" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-primary outline-none" value={newPassword} onChange={e => setNewPassword(e.target.value)} />
                                    </div>
                                </div>
                                
                                <button type="submit" className="w-full bg-success hover:bg-emerald-600 text-white font-bold py-3 rounded-xl mt-6 transition-all shadow-md">
                                    حفظ الرقم السري وتأكيد الدخول
                                </button>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        const SettingsView = ({ setIsAuthenticated, patients, setPatients, tests, setTests, labDetails, setLabDetails, adminPassword, setAdminPassword }) => {
            const [activeSubTab, setActiveSubTab] = useState('tests');
            const [labFormDetails, setLabFormDetails] = useState(labDetails);

            const handleSaveLabDetails = (e) => {
                e.preventDefault();
                setLabDetails(labFormDetails);
            };

            return (
                <div className="fade-in h-full flex flex-col">
                    <div className="flex flex-wrap gap-2 mb-6 bg-white p-2 rounded-xl shadow-sm border border-slate-100 w-fit mx-auto sm:mx-0">
                        <button onClick={() => setActiveSubTab('tests')} className={`px-4 sm:px-6 py-2.5 rounded-lg font-bold transition-all ${activeSubTab === 'tests' ? 'bg-slate-800 text-white shadow-md' : 'hover:bg-slate-100 text-slate-600'}`}>
                            <i className="fas fa-vials ml-2"></i> إدارة التحاليل
                        </button>
                        <button onClick={() => setActiveSubTab('patients')} className={`px-4 sm:px-6 py-2.5 rounded-lg font-bold transition-all ${activeSubTab === 'patients' ? 'bg-slate-800 text-white shadow-md' : 'hover:bg-slate-100 text-slate-600'}`}>
                            <i className="fas fa-users ml-2"></i> إدارة المرضى
                        </button>
                        <button onClick={() => setActiveSubTab('lab')} className={`px-4 sm:px-6 py-2.5 rounded-lg font-bold transition-all ${activeSubTab === 'lab' ? 'bg-slate-800 text-white shadow-md' : 'hover:bg-slate-100 text-slate-600'}`}>
                            <i className="fas fa-clinic-medical ml-2"></i> إدارة المختبر
                        </button>
                        <button onClick={() => setIsAuthenticated(false)} className="px-4 py-2.5 rounded-lg font-bold text-danger hover:bg-red-50 transition-all mr-auto border-r border-slate-200">
                            خروج <i className="fas fa-sign-out-alt ml-1"></i>
                        </button>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto overflow-x-hidden custom-scrollbar">
                        {activeSubTab === 'tests' && <TestsView tests={tests} setTests={setTests} readOnly={false} />}
                        {activeSubTab === 'patients' && <PatientsView patients={patients} setPatients={setPatients} orders={orders} tests={tests} readOnly={false} />}
                        {activeSubTab === 'lab' && (
                            <form onSubmit={handleSaveLabDetails} className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 fade-in max-w-2xl mx-auto w-full mt-4">
                                <h2 className="text-xl font-bold text-slate-800 mb-6 border-b pb-4"><i className="fas fa-clinic-medical text-primary ml-2"></i> إعدادات معلومات المختبر</h2>
                                <div className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1.5">اسم المختبر (عربي)</label>
                                        <input required type="text" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-primary outline-none transition-all" value={labFormDetails.name} onChange={e => setLabFormDetails({...labFormDetails, name: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1.5">اسم المختبر (انجليزي)</label>
                                        <input required type="text" dir="ltr" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-primary outline-none transition-all text-left" value={labFormDetails.nameEn} onChange={e => setLabFormDetails({...labFormDetails, nameEn: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1.5">العنوان</label>
                                        <input required type="text" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-primary outline-none transition-all" value={labFormDetails.address} onChange={e => setLabFormDetails({...labFormDetails, address: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1.5">رقم الهاتف (سيُستخدم لتسجيل الدخول)</label>
                                        <input required type="text" dir="ltr" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-primary outline-none transition-all text-left" value={labFormDetails.phone} onChange={e => setLabFormDetails({...labFormDetails, phone: e.target.value})} />
                                    </div>
                                </div>
                                
                                <div className="mt-6 pt-4 border-t">
                                    <button type="submit" className="px-8 py-3 bg-primary text-white font-bold rounded-xl hover:bg-blue-600 shadow-md shadow-blue-500/20 transition-all flex items-center gap-2">
                                        <i className="fas fa-save"></i> حفظ الإعدادات
                                    </button>
                                </div>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            const [patients, setPatients] = useLocalStorage('lis_patients', initialPatients);
            const [tests, setTests] = useLocalStorage('lis_tests', testCatalog);
            const [orders, setOrders] = useLocalStorage('lis_orders', initialOrders);
            const [labDetails, setLabDetails] = useLocalStorage('lis_labDetails', {
                name: 'مختبر الشفاء التخصصي',
                nameEn: 'Al-Shifa Specialized Laboratory',
                phone: '07712345678',
                address: 'بغداد - شارع فلسطين'
            });
            const [adminPassword, setAdminPassword] = useLocalStorage('lis_adminPwd', 'admin123');
            
            const [timeFilter, setTimeFilter] = useState('day'); 

            useEffect(() => {
                const lastReset = localStorage.getItem('lis_last_reset');
                const currentTime = new Date().getTime();
                const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;

                if (!lastReset) {
                    localStorage.setItem('lis_last_reset', currentTime);
                } else if (currentTime - parseInt(lastReset) > TWENTY_FOUR_HOURS) {
                    setOrders(initialOrders);
                    localStorage.setItem('lis_last_reset', currentTime);
                }
            }, []);
            
            const [isAuthenticated, setIsAuthenticated] = useLocalStorage('lis_is_authenticated', false);

            if (!isAuthenticated) {
                return (
                    <AuthScreen 
                        setIsAuthenticated={setIsAuthenticated} 
                        labDetails={labDetails} 
                        setLabDetails={setLabDetails} 
                        adminPassword={adminPassword} 
                        setAdminPassword={setAdminPassword} 
                    />
                );
            }

            const calculateRevenue = () => {
                return orders.filter(o => o.status === 'مكتمل').reduce((sum, order) => sum + order.total, 0);
            };

            const renderContent = () => {
                switch(activeTab) {
                    case 'dashboard': return <DashboardView patients={patients} orders={orders} revenue={calculateRevenue()} timeFilter={timeFilter} setTimeFilter={setTimeFilter} />;
                    case 'patients': return <PatientsView patients={patients} setPatients={setPatients} orders={orders} tests={tests} labDetails={labDetails} readOnly={false} />;
                    case 'orders': return <OrdersView orders={orders} setOrders={setOrders} patients={patients} setPatients={setPatients} tests={tests} labDetails={labDetails} />;
                    case 'settings': return <SettingsView setIsAuthenticated={setIsAuthenticated} patients={patients} setPatients={setPatients} tests={tests} setTests={setTests} labDetails={labDetails} setLabDetails={setLabDetails} adminPassword={adminPassword} setAdminPassword={setAdminPassword} />;
                    default: return <DashboardView patients={patients} orders={orders} revenue={calculateRevenue()} timeFilter={timeFilter} setTimeFilter={setTimeFilter} />;
                }
            };

            const navItems = [
                { id: 'dashboard', label: 'الرئيسية', icon: 'fa-home' },
                { id: 'orders', label: 'الطلبات والنتائج', icon: 'fa-flask' },
                { id: 'patients', label: 'المرضى', icon: 'fa-users' },
                { id: 'settings', label: 'النظام والإدارة', icon: 'fa-cog' },
            ];

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-slate-100/50">
                    <nav className="bg-slate-900 text-white w-full md:w-72 md:min-h-screen flex flex-col shadow-2xl z-50 sticky top-0 no-print">
                        <div className="p-6 border-b border-slate-800 flex items-center justify-between md:block">
                            <div className="flex items-center gap-3 mb-0 md:mb-6">
                                <div className="w-10 h-10 md:w-12 md:h-12 bg-gradient-to-br from-primary to-secondary rounded-xl flex items-center justify-center text-xl md:text-2xl shadow-lg shadow-primary/20">
                                    <i className="fas fa-microscope"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg md:text-xl font-black tracking-wide leading-none">{labDetails.name}</h1>
                                    <span className="text-xs text-slate-400 font-medium">نظام الإدارة الذكي LIS</span>
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 overflow-x-auto md:overflow-y-auto custom-scrollbar flex md:flex-col p-3 gap-2">
                            {navItems.map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all whitespace-nowrap text-right
                                        ${activeTab === item.id 
                                            ? 'bg-primary text-white font-bold shadow-md' 
                                            : 'text-slate-400 hover:bg-slate-800 hover:text-white font-medium'}`}
                                >
                                    <i className={`fas ${item.icon} w-5 text-center ${activeTab === item.id ? 'opacity-100' : 'opacity-70'}`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </div>
                        
                        <div className="p-4 border-t border-slate-800 hidden md:block">
                            <div className="bg-slate-800 rounded-xl p-4 flex items-center gap-3 border border-slate-700">
                                <div className="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center">
                                    <i className="fas fa-user-tie text-slate-300"></i>
                                </div>
                                <div>
                                    <p className="text-sm font-bold text-white leading-tight">مدير النظام</p>
                                    <p className="text-xs text-slate-400 mt-0.5"><span className="w-2 h-2 rounded-full bg-success inline-block mr-1"></span> متصل</p>
                                </div>
                                <button onClick={() => setIsAuthenticated(false)} className="mr-auto text-slate-400 hover:text-white" title="تسجيل خروج">
                                    <i className="fas fa-sign-out-alt"></i>
                                </button>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-1 p-4 md:p-8 h-screen overflow-y-auto custom-scrollbar bg-slate-50 relative">
                        {renderContent()}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
