<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المختبرات الطبية المتطور (LIS)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#4f46e5',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: '#1e293b',
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        
        @media print {
            body { background-color: white; }
            body * { visibility: hidden; }
            #printable-report, #printable-report * { visibility: visible; }
            #printable-report { 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 100%; 
                margin: 0; 
                padding: 20px; 
                box-shadow: none !important; 
                border: none !important;
            }
            .no-print { display: none !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; rounded: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const initialPatients = [
            { id: 'P-1001', name: 'أحمد محمد علي', age: 34, gender: 'ذكر', phone: '07701234567', email: 'ahmed@gmail.com', regDate: '2026-08-25' },
            { id: 'P-1002', name: 'فاطمة حسن إبراهيم', age: 28, gender: 'أنثى', phone: '07809876543', email: 'fatima@gmail.com', regDate: '2026-08-26' },
            { id: 'P-1003', name: 'محمود عبد الله', age: 45, gender: 'ذكر', phone: '07501122334', email: 'mahmoud@gmail.com', regDate: '2026-08-28' },
        ];

        const testCatalog = [
            { id: 'T-01', name: 'صورة الدم الكاملة (CBC)', category: 'أمراض الدم', price: 15000, unit: '10^3/uL', normalRange: '4.5 - 11.0', type: 'single', min: 4.5, max: 11.0 },
            { id: 'T-02', name: 'فحص السكر الصائم (FBS)', category: 'الكيمياء السريرية', price: 10000, unit: 'mg/dL', normalRange: '70 - 99', type: 'single', min: 70, max: 99 },
            { id: 'T-03', name: 'دهون الثلاثية (Triglycerides)', category: 'الكيمياء السريرية', price: 20000, unit: 'mg/dL', normalRange: '0 - 150', type: 'single', min: 0, max: 150 },
            { id: 'T-04', name: 'فيتامين د (Vitamin D3)', category: 'الهرمونات', price: 35000, unit: 'ng/mL', normalRange: '30 - 100', type: 'single', min: 30, max: 100 },
            { id: 'T-05', name: 'تحليل الإدرار العام (GUE)', category: 'التحاليل العامة', price: 5000, unit: '-', normalRange: 'طبيعي', type: 'text' },
        ];

        const initialOrders = [
            {
                id: 'ORD-501',
                patientId: 'P-1001',
                date: '2026-08-30 09:30:00',
                status: 'مكتمل',
                total: 25000,
                tests: [
                    { testId: 'T-01', result: '8.2', isAbnormal: false },
                    { testId: 'T-02', result: '125', isAbnormal: true }
                ]
            }
        ];

        const useLocalStorage = (key, initialValue) => {
            const [value, setValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error("Error reading localStorage", error);
                    return initialValue;
                }
            });

            useEffect(() => {
                try {
                    window.localStorage.setItem(key, JSON.stringify(value));
                } catch (error) {
                    console.error("Error setting localStorage", error);
                }
            }, [key, value]);

            return [value, setValue];
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-[fadeIn_0.2s_ease-out]">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden max-h-[90vh] flex flex-col border border-slate-100 transform transition-all">
                        <div className="px-6 py-4 bg-slate-50 border-b flex justify-between items-center">
                            <h3 className="font-bold text-lg text-slate-800">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-danger w-8 h-8 rounded-full flex items-center justify-center hover:bg-red-50 transition-colors">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 custom-scrollbar">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const DashboardView = ({ patients, orders, revenue, timeFilter, setTimeFilter }) => {
            const now = new Date();
            const filteredOrders = orders.filter(o => {
                const orderDate = new Date(o.date.replace(' ', 'T'));
                if (isNaN(orderDate)) return true;
                if (timeFilter === 'day') {
                    return orderDate.toDateString() === now.toDateString();
                } else if (timeFilter === 'week') {
                    const diffTime = Math.abs(now - orderDate);
                    const diffDays = diffTime / (1000 * 60 * 60 * 24);
                    return diffDays <= 7;
                } else if (timeFilter === 'month') {
                    return orderDate.getMonth() === now.getMonth() && orderDate.getFullYear() === now.getFullYear();
                }
                return true; 
            });

            const completedCount = filteredOrders.filter(o => o.status === 'مكتمل').length;
            const pendingCount = filteredOrders.filter(o => o.status === 'قيد الانتظار').length;
            const filteredRevenue = filteredOrders.filter(o => o.status === 'مكتمل').reduce((sum, o) => sum + o.total, 0);

            return (
                <div className="space-y-6 fade-in">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100 gap-4">
                        <div>
                            <h3 className="text-lg font-bold text-slate-800">لوحة المؤشرات والعمليات</h3>
                            <p className="text-xs text-slate-500">إحصائيات وحركة المختبر حسب النطاق الزمني المحدد.</p>
                        </div>
                        <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                            <button 
                                onClick={() => setTimeFilter('day')} 
                                className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${timeFilter === 'day' ? 'bg-primary text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                يوم
                            </button>
                            <button 
                                onClick={() => setTimeFilter('week')} 
                                className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${timeFilter === 'week' ? 'bg-primary text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                أسبوع
                            </button>
                            <button 
                                onClick={() => setTimeFilter('month')} 
                                className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${timeFilter === 'month' ? 'bg-primary text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                شهر
                            </button>
                            <button 
                                onClick={() => setTimeFilter('all')} 
                                className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${timeFilter === 'all' ? 'bg-primary text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                الكل
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 hover:shadow-md transition-shadow">
                            <div className="w-14 h-14 rounded-2xl bg-blue-50 text-primary flex items-center justify-center text-2xl font-bold">
                                <i className="fas fa-users"></i>
                            </div>
                            <div>
                                <p className="text-sm text-slate-500 font-medium">إجمالي المرضى</p>
                                <h3 className="text-2xl font-black text-slate-800 mt-1">{patients.length}</h3>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 hover:shadow-md transition-shadow">
                            <div className="w-14 h-14 rounded-2xl bg-amber-50 text-warning flex items-center justify-center text-2xl font-bold">
                                <i className="fas fa-clock"></i>
                            </div>
                            <div>
                                <p className="text-sm text-slate-500 font-medium">طلبات قيد الانتظار</p>
                                <h3 className="text-2xl font-black text-slate-800 mt-1">{pendingCount}</h3>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 hover:shadow-md transition-shadow">
                            <div className="w-14 h-14 rounded-2xl bg-emerald-50 text-success flex items-center justify-center text-2xl font-bold">
                                <i className="fas fa-check-circle"></i>
                            </div>
                            <div>
                                <p className="text-sm text-slate-500 font-medium">التحاليل المكتملة</p>
                                <h3 className="text-2xl font-black text-slate-800 mt-1">{completedCount}</h3>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 hover:shadow-md transition-shadow">
                            <div className="w-14 h-14 rounded-2xl bg-indigo-50 text-secondary flex items-center justify-center text-2xl font-bold">
                                <i className="fas fa-coins"></i>
                            </div>
                            <div>
                                <p className="text-sm text-slate-500 font-medium">الإيرادات ({timeFilter === 'day' ? 'اليوم' : timeFilter === 'week' ? 'الأسبوع' : timeFilter === 'month' ? 'الشهر' : 'الكل'})</p>
                                <h3 className="text-2xl font-black text-slate-800 mt-1">{filteredRevenue.toLocaleString()} د.ع</h3>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold text-slate-800">أحدث طلبات التحليل ({timeFilter === 'day' ? 'اليوم' : timeFilter === 'week' ? 'الأسبوع' : timeFilter === 'month' ? 'الشهر' : 'الكل'})</h3>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-right">
                                <thead className="text-xs text-slate-400 uppercase bg-slate-50/50 border-b">
                                    <tr>
                                        <th className="px-4 py-3 font-semibold">رقم الطلب</th>
                                        <th className="px-4 py-3 font-semibold">المريض</th>
                                        <th className="px-4 py-3 font-semibold">التاريخ والوقت</th>
                                        <th className="px-4 py-3 font-semibold">المبلغ</th>
                                        <th className="px-4 py-3 font-semibold">الحالة</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredOrders.length > 0 ? filteredOrders.slice(0, 5).map(order => {
                                        const pat = patients.find(p => p.id === order.patientId);
                                        return (
                                            <tr key={order.id} className="border-b last:border-0 hover:bg-slate-50 transition-colors">
                                                <td className="px-4 py-4 font-bold text-primary">{order.id}</td>
                                                <td className="px-4 py-4 font-semibold text-slate-800">{pat ? pat.name : 'غير معروف'}</td>
                                                <td className="px-4 py-4 text-slate-500" dir="ltr">{order.date}</td>
                                                <td className="px-4 py-4 font-bold text-slate-700">{order.total.toLocaleString()} د.ع</td>
                                                <td className="px-4 py-4">
                                                    <span className={`px-3 py-1.5 rounded-full text-xs font-bold flex inline-flex items-center gap-1.5 w-fit ${order.status === 'مكتمل' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                                                        {order.status === 'مكتمل' ? <i className="fas fa-check"></i> : <i className="fas fa-hourglass-half"></i>}
                                                        {order.status}
                                                    </span>
                                                </td>
                                            </tr>
                                        );
                                    }) : (
                                        <tr>
                                            <td colSpan="5" className="px-6 py-8 text-center text-slate-400">لا توجد طلبات في هذه الفترة.</td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const PatientsView = ({ patients, setPatients, orders, tests, labDetails, readOnly = true }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingPatient, setEditingPatient] = useState(null);
            const defaultForm = { name: '', age: '', gender: 'ذكر', phone: '', email: '' };
            const [formData, setFormData] = useState(defaultForm);

            const [selectedPatientFile, setSelectedPatientFile] = useState(null);
            const [viewingReportOrder, setViewingReportOrder] = useState(null);

            const filtered = patients.filter(p => p.name.includes(searchTerm) || p.phone.includes(searchTerm) || p.id.includes(searchTerm));

            const handleOpenModal = (pat = null) => {
                if (pat) {
                    setEditingPatient(pat.id);
                    setFormData(pat);
                } else {
                    setEditingPatient(null);
                    setFormData(defaultForm);
                }
                setIsModalOpen(true);
            };

            const handleSave = (e) => {
                e.preventDefault();
                if (editingPatient) {
                    setPatients(patients.map(p => p.id === editingPatient ? { ...formData, id: editingPatient } : p));
                } else {
                    const newId = `P-${Math.floor(1000 + Math.random() * 9000)}`;
                    const newPat = { ...formData, id: newId, regDate: new Date().toISOString().slice(0, 10) };
                    setPatients([newPat, ...patients]);
                }
                setIsModalOpen(false);
            };

            const handleDelete = (id) => {
                setPatients(patients.filter(p => p.id !== id));
            };

            const patientOrders = selectedPatientFile ? orders.filter(o => o.patientId === selectedPatientFile.id) : [];

            return (
                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 fade-in flex flex-col h-full">
                    <div className="p-6 border-b flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800">قائمة المرضى المسجلين</h2>
                            <p className="text-sm text-slate-500 mt-1">إدارة بيانات المرضى والملفات السريرية وسجلات الفحوصات.</p>
                        </div>
                        <div className="flex gap-3 w-full sm:w-auto">
                            <div className="relative w-full sm:w-72">
                                <i className="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input 
                                    type="text" 
                                    placeholder="بحث بالاسم، الهاتف، المعرف..." 
                                    className="pl-4 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl w-full focus:outline-none focus:border-primary focus:ring-2 focus:ring-blue-100 transition-all text-sm"
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                />
                            </div>
                            {!readOnly && (
                                <button onClick={() => handleOpenModal()} className="bg-primary hover:bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 whitespace-nowrap shadow-sm hover:shadow transition-all">
                                    <i className="fas fa-user-plus"></i> إضافة مريض
                                </button>
                            )}
                        </div>
                    </div>
                    <div className="overflow-y-auto flex-1 custom-scrollbar">
                        <table className="w-full text-sm text-right">
                            <thead className="bg-slate-50 text-slate-500 uppercase text-xs border-b sticky top-0 z-10">
                                <tr>
                                    <th className="px-6 py-4 font-bold">معرف المريض</th>
                                    <th className="px-6 py-4 font-bold">الاسم الكامل</th>
                                    <th className="px-6 py-4 font-bold">العمر والجنس</th>
                                    <th className="px-6 py-4 font-bold">رقم الهاتف</th>
                                    <th className="px-6 py-4 font-bold">تاريخ التسجيل</th>
                                    <th className="px-6 py-4 font-bold text-center">الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filtered.map(pat => (
                                    <tr key={pat.id} className="border-b last:border-0 hover:bg-slate-50/80 transition-colors">
                                        <td className="px-6 py-4 font-bold text-primary">{pat.id}</td>
                                        <td className="px-6 py-4 font-bold text-slate-800">{pat.name}</td>
                                        <td className="px-6 py-4 text-slate-600">{pat.age} سنة ({pat.gender})</td>
                                        <td className="px-6 py-4 text-slate-600" dir="ltr">{pat.phone || '-'}</td>
                                        <td className="px-6 py-4 text-slate-500" dir="ltr">{pat.regDate}</td>
                                        <td className="px-6 py-4 text-center space-x-2 space-x-reverse">
                                            <button onClick={() => setSelectedPatientFile(pat)} className="bg-primary/10 hover:bg-primary/20 text-primary px-3 py-1.5 rounded-lg font-bold text-xs transition-colors border border-primary/20">
                                                <i className="fas fa-folder-open ml-1"></i> الملف الطبي
                                            </button>
                                            {!readOnly && (
                                                <>
                                                    <button onClick={() => handleOpenModal(pat)} className="text-slate-400 hover:text-primary p-2 rounded-lg hover:bg-blue-50 transition-colors" title="تعديل"><i className="fas fa-edit"></i></button>
                                                    <button onClick={() => handleDelete(pat.id)} className="text-slate-400 hover:text-danger p-2 rounded-lg hover:bg-red-50 transition-colors" title="حذف"><i className="fas fa-trash"></i></button>
                                                </>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <Modal isOpen={!!selectedPatientFile} onClose={() => { setSelectedPatientFile(null); setViewingReportOrder(null); }} title={viewingReportOrder ? `تقرير التحليل الكامل - ${selectedPatientFile?.name}` : `الملف المرضي الشامل - ${selectedPatientFile?.name}`}>
                        <div className="space-y-6">
                            {!viewingReportOrder ? (
                                <>
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm">
                                        <div>
                                            <span className="text-slate-400 text-xs block font-bold">معرف المريض</span>
                                            <strong className="text-primary">{selectedPatientFile?.id}</strong>
                                        </div>
                                        <div>
                                            <span className="text-slate-400 text-xs block font-bold">العمر والجنس</span>
                                            <strong className="text-slate-800">{selectedPatientFile?.age} سنة ({selectedPatientFile?.gender})</strong>
                                        </div>
                                        <div>
                                            <span className="text-slate-400 text-xs block font-bold">رقم الهاتف</span>
                                            <strong className="text-slate-800" dir="ltr">{selectedPatientFile?.phone || '-'}</strong>
                                        </div>
                                        <div>
                                            <span className="text-slate-400 text-xs block font-bold">تاريخ التسجيل</span>
                                            <strong className="text-slate-800" dir="ltr">{selectedPatientFile?.regDate}</strong>
                                        </div>
                                    </div>

                                    <div>
                                        <h4 className="font-bold text-slate-800 mb-3 text-base flex items-center gap-2">
                                            <i className="fas fa-history text-primary"></i> سجل الفحوصات والتحاليل السابقة في المختبر ({patientOrders.length})
                                        </h4>
                                        {patientOrders.length > 0 ? (
                                            <div className="space-y-4 max-h-[350px] overflow-y-auto custom-scrollbar pr-1">
                                                {patientOrders.map(order => (
                                                    <div key={order.id} className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:border-blue-200 transition-colors flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                                        <div className="flex-1">
                                                            <div className="flex items-center gap-3 mb-2">
                                                                <span className="font-bold text-primary text-base">{order.id}</span>
                                                                <span className="text-xs text-slate-400" dir="ltr">{order.date}</span>
                                                                <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${order.status === 'مكتمل' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                                                                    {order.status}
                                                                </span>
                                                            </div>
                                                            <div className="flex flex-wrap gap-2">
                                                                {order.tests.map(t => {
                                                                    const testMeta = tests.find(item => item.id === t.testId);
                                                                    return (
                                                                        <span key={t.testId} className="bg-slate-50 px-2.5 py-1 rounded-lg border text-xs font-semibold text-slate-700" dir="ltr">
                                                                            {testMeta ? testMeta.name : t.testId}: <strong className={t.isAbnormal ? 'text-red-600' : 'text-slate-800'}>{t.result || 'قيد الانتظار'}</strong>
                                                                        </span>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                        {order.status === 'مكتمل' && (
                                                            <button 
                                                                onClick={() => setViewingReportOrder(order)} 
                                                                className="bg-primary hover:bg-blue-600 text-white px-4 py-2.5 rounded-xl font-bold text-xs transition-all flex items-center gap-2 whitespace-nowrap shadow-sm"
                                                            >
                                                                <i className="fas fa-file-medical"></i> عرض التقرير الكامل
                                                            </button>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>

                                                </div>
                                            </div>
                                            <div className="text-left" dir="ltr">

                                            </div>
                                        </div>

                                        <div className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border text-xs print:bg-white">
                                            <div>
                                                <span className="text-slate-400 block font-semibold">المريض / Patient Name</span>
                                                <strong className="text-slate-900 text-sm">{selectedPatientFile?.name}</strong>
                                            </div>
                                            <div>
                                                <span className="text-slate-400 block font-semibold">العمر والجنس / Age & Gender</span>

                                            <div>
                                                <span className="text-slate-400 block font-semibold">رقم الملف / ID</span>

                    </Modal>

                    {!readOnly && (
                        <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title={editingPatient ? "تعديل بيانات المريض" : "إضافة مريض جديد"}>

                                </div>
                                <div className="grid grid-cols-2 gap-5">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1.5">رقم الهاتف (اختياري)</label>

        };

        const TestsView = ({ tests, setTests, readOnly = true }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingTestId, setEditingTestId] = useState(null);
            const defaultForm = { name: '', category: 'الكيمياء السريرية', price: '', unit: '', normalRange: '', min: '', max: '' };
            const [formData, setFormData] = useState(defaultForm);

            const filtered = tests.filter(t => t.name.toLowerCase().includes(searchTerm.toLowerCase()) || t.category.includes(searchTerm) || t.id.includes(searchTerm));

            const handleOpenModal = (test = null) => {
                if (test) {
                    setEditingTestId(test.id);
                    setFormData(test);
                } else {
                    setEditingTestId(null);
                    setFormData(defaultForm);
                }
                setIsModalOpen(true);
            };

            const handleSave = (e) => {
                e.preventDefault();
                const processed = { 
                    ...formData, 
                    price: Number(formData.price),
                    min: formData.min !== '' ? Number(formData.min) : undefined,
                    max: formData.max !== '' ? Number(formData.max) : undefined,
                    type: 'single'
                };

                if (editingTestId) {
                    setTests(tests.map(t => t.id === editingTestId ? { ...processed, id: editingTestId } : t));
                } else {
                    const newId = `T-${Math.floor(100 + Math.random() * 900)}`;
                    setTests([...tests, { ...processed, id: newId }]);
                }
                setIsModalOpen(false);
            };

            const handleDelete = (id) => {
                setTests(tests.filter(t => t.id !== id));
            };

            return (
                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 fade-in flex flex-col h-full">
                    <div className="p-6 border-b flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800">دليل تحاليل المختبر {readOnly && '(عرض فقط)'}</h2>
                            <p className="text-sm text-slate-500 mt-1">قائمة التحاليل، الأسعار، والمعدلات الطبيعية المرجعية.</p>
                        </div>
                        <div className="flex gap-3 w-full sm:w-auto">
                            <div className="relative w-full sm:w-72">
                                <i className="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input 
                                    type="text" 
                                    placeholder="بحث عن تحليل (كود، اسم، فئة)..." 
                                    className="pl-4 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl w-full focus:outline-none focus:border-primary focus:ring-2 focus:ring-blue-100 transition-all text-sm"
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                />
                            </div>
                            {!readOnly && (
                                <button onClick={() => handleOpenModal()} className="bg-primary hover:bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 whitespace-nowrap shadow-sm hover:shadow transition-all">
                                    <i className="fas fa-plus"></i> إضافة تحليل
                                </button>
                            )}
                        </div>
                    </div>
                    <div className="overflow-y-auto flex-1 custom-scrollbar">
                        <table className="w-full text-sm text-right">
                            <thead className="bg-slate-50 text-slate-500 uppercase text-xs border-b sticky top-0 z-10">
                                <tr>
                                    <th className="px-6 py-4 font-bold">الكود</th>
                                    <th className="px-6 py-4 font-bold">اسم التحليل</th>
                                    <th className="px-6 py-4 font-bold">الفئة الطبية</th>
                                    <th className="px-6 py-4 font-bold">المعدل الطبيعي (المرجعي)</th>
                                    <th className="px-6 py-4 font-bold">السعر</th>
                                    {!readOnly && <th className="px-6 py-4 font-bold text-center">إجراءات</th>}
                                </tr>
                            </thead>
                            <tbody>
                                {filtered.map(t => (
                                    <tr key={t.id} className="border-b last:border-0 hover:bg-slate-50/80 transition-colors">
                                        <td className="px-6 py-4 font-bold text-primary">{t.id}</td>
                                        <td className="px-6 py-4 font-bold text-slate-800" dir="ltr">{t.name}</td>
                                        <td className="px-6 py-4">
                                            <span className="bg-white border border-slate-200 px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-600 shadow-sm">{t.category}</span>
                                        </td>
                                        <td className="px-6 py-4 text-slate-600" dir="ltr">
                                            {t.normalRange} <span className="text-slate-400 ml-1 font-medium">{t.unit !== '-' ? t.unit : ''}</span>
                                        </td>
                                        <td className="px-6 py-4 font-bold text-emerald-600">{t.price.toLocaleString()} د.ع</td>
                                        {!readOnly && (
                                            <td className="px-6 py-4 text-center">
                                                <div className="flex justify-center gap-2">
                                                    <button onClick={() => handleOpenModal(t)} className="text-slate-400 hover:text-primary p-2 rounded-lg hover:bg-blue-50 transition-colors" title="تعديل"><i className="fas fa-edit"></i></button>
                                                    <button onClick={() => handleDelete(t.id)} className="text-slate-400 hover:text-danger p-2 rounded-lg hover:bg-red-50 transition-colors" title="حذف"><i className="fas fa-trash"></i></button>
                                                </div>
                                            </td>
                                        )}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {!readOnly && (
                        <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title={editingTestId ? "تعديل بيانات التحليل" : "إضافة تحليل جديد"}>
                            <form onSubmit={handleSave} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1.5">اسم التحليل (إنجليزي / عربي)</label>
                                    <input required type="text" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition-all text-left" dir="ltr" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder="e.g., Fasting Blood Sugar (FBS)" />
                                </div>
                                <div className="grid grid-cols-2 gap-5">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1.5">الفئة الطبية</label>
                                        <select className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition-all" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}>
                                            <option value="الكيمياء السريرية">الكيمياء السريرية</option>
                                            <option value="أمراض الدم">أمراض الدم</option>
                                            <option value="الهرمونات">الهرمونات</option>
                                            <option value="التحاليل العامة">التحاليل العامة</option>
                                            <option value="المناعة والأمصال">المناعة والأمصال</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1.5">السعر (د.ع)</label>
                                        <input required type="number" min="0" step="250" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition-all" value={formData.price} onChange={e => setFormData({...formData, price: e.target.value})} />
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-5">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1.5">وحدة القياس</label>
                                        <input type="text" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition-all text-left" dir="ltr" placeholder="e.g., mg/dL, ng/mL" value={formData.unit} onChange={e => setFormData({...formData, unit: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1.5">نص المعدل الطبيعي (للطباعة)</label>
                                        <input required type="text" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition-all text-left" dir="ltr" placeholder="e.g., 70 - 99" value={formData.normalRange} onChange={e => setFormData({...formData, normalRange: e.target.value})} />
                                    </div>
                                </div>
                                
                                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                    <div className="grid grid-cols-2 gap-5">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1.5">الحد الأدنى (اختياري)</label>
                                            <input type="number" step="any" className="w-full p-2.5 bg-white border border-slate-200 rounded-lg outline-none focus:border-primary" value={formData.min} onChange={e => setFormData({...formData, min: e.target.value})} placeholder="الحد لتلوين النتيجة أحمر" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1.5">الحد الأقصى (اختياري)</label>
                                            <input type="number" step="any" className="w-full p-2.5 bg-white border border-slate-200 rounded-lg outline-none focus:border-primary" value={formData.max} onChange={e => setFormData({...formData, max: e.target.value})} placeholder="الحد لتلوين النتيجة أحمر" />
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="pt-4 flex justify-end gap-3 mt-4 border-t">
                                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-5 py-2.5 rounded-xl text-slate-600 font-semibold hover:bg-slate-100 transition-colors">إلغاء</button>
                                    <button type="submit" className="px-6 py-2.5 bg-primary text-white font-bold rounded-xl hover:bg-blue-600 shadow-md shadow-blue-500/20 transition-all">حفظ التحليل</button>
                                </div>
                            </form>
                        </Modal>
                    )}
                </div>
            );
        };

        const OrdersView = ({ orders, setOrders, patients, setPatients, tests, labDetails }) => {
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [isNewModalOpen, setIsNewModalOpen] = useState(false);
            
            const [orderMode, setOrderMode] = useState('existing');
            const [newOrderData, setNewOrderData] = useState({ patientId: '', selectedTests: [] });
            const [newPatientData, setNewPatientData] = useState({ name: '', age: '', gender: 'ذكر', phone: '', email: '' });

            const [enteringOrder, setEnteringOrder] = useState(null);
            const [resultInputs, setResultInputs] = useState({});

            const [aiInterpretation, setAiInterpretation] = useState('');
            const [isAiLoading, setIsAiLoading] = useState(false);

            const toggleTestSelection = (testId) => {
                setNewOrderData(prev => ({
                    ...prev,
                    selectedTests: prev.selectedTests.includes(testId)
                        ? prev.selectedTests.filter(id => id !== testId)
                        : [...prev.selectedTests, testId]
                }));
            };

            const handleCreateOrder = (e) => {
                e.preventDefault();
                let finalPatientId = newOrderData.patientId;

                if (orderMode === 'new') {
                    finalPatientId = `P-${Math.floor(1000 + Math.random() * 9000)}`;
                    const newPat = { ...newPatientData, id: finalPatientId, regDate: new Date().toISOString().slice(0, 10) };
                    setPatients([newPat, ...patients]);
                } else if (!finalPatientId) {
                    return;
                }

                if (newOrderData.selectedTests.length === 0) return;

                const selectedObjs = newOrderData.selectedTests.map(id => tests.find(t => t.id === id));
                const total = selectedObjs.reduce((sum, t) => sum + t.price, 0);

                const newOrder = {
                    id: `ORD-${Math.floor(500 + Math.random() * 9000)}`,
                    patientId: finalPatientId,
                    date: new Date().toISOString().replace('T', ' ').slice(0, 19),
                    status: 'قيد الانتظار',
                    total: total,
                    tests: newOrderData.selectedTests.map(testId => ({ testId, result: '', isAbnormal: false }))
                };

                setOrders([newOrder, ...orders]);
                setIsNewModalOpen(false);
                setNewOrderData({ patientId: '', selectedTests: [] });
                setNewPatientData({ name: '', age: '', gender: 'ذكر', phone: '', email: '' });
                setOrderMode('existing');
            };

            const startResultEntry = (order) => {
                setEnteringOrder(order);
                const initialRes = {};
                order.tests.forEach(t => {
                    initialRes[t.testId] = t.result || '';
                });
                setResultInputs(initialRes);
            };

            const saveResults = (e) => {
                e.preventDefault();
                const updatedTests = enteringOrder.tests.map(item => {
                    const val = resultInputs[item.testId];
                    const testMeta = tests.find(t => t.id === item.testId);
                    let isAbnormal = false;
                    
                    if (testMeta && testMeta.min !== undefined && testMeta.max !== undefined && val !== '') {
                        const num = parseFloat(val);
                        if (!isNaN(num) && (num < testMeta.min || num > testMeta.max)) {
                            isAbnormal = true;
                        }
                    }
                    return { ...item, result: val, isAbnormal };
                });

                const updatedOrders = orders.map(o => o.id === enteringOrder.id ? { ...o, tests: updatedTests, status: 'مكتمل' } : o);
                setOrders(updatedOrders);
                setEnteringOrder(null);
            };

            const generateAiInterpretation = (order) => {
                setIsAiLoading(true);
                setAiInterpretation('');

                setTimeout(() => {
                    const abnormalTests = order.tests.filter(t => t.isAbnormal);
                    let reportText = "";

                    if (abnormalTests.length > 0) {
                        const testNames = abnormalTests.map(a => tests.find(t => t.id === a.testId)?.name || a.testId).join(' و ');
                        reportText = `التحليل السريري الذكي: \n\nبناءً على المعطيات المخبرية المرفقة، يُلاحظ وجود قيم تقع خارج النطاق المرجعي الطبيعي في التحاليل التالية: [ ${testNames} ].\n\nهذا الارتفاع/الانخفاض قد يكون له دلالات سريرية. يُنصح بعرض هذا التقرير على الطبيب المختص لربط هذه النتائج بالأعراض السريرية للمريض.\nباقي المؤشرات المفحوصة تبدو ضمن الحدود الطبيعية.`;
                    } else {
                        reportText = `التحليل السريري الذكي: \n\nتشير النتائج المخبرية الحالية إلى أن جميع المؤشرات التي تم فحصها تقع ضمن الحدود الطبيعية المرجعية المعتمدة.\nلا توجد دلالات مخبرية واضحة على اختلالات في هذه القراءات.`;
                    }
                    
                    setAiInterpretation(reportText);
                    setIsAiLoading(false);
                }, 1500);
            };

            return (
                <div className="space-y-6 fade-in h-full flex flex-col">
                    {!selectedOrder && !enteringOrder && (

                                <div id="printable-report" className="bg-white rounded-3xl shadow-lg border border-slate-200 p-10 space-y-8 print:shadow-none print:border-none print:p-0">
                                    <div className="flex justify-between items-start border-b-2 border-slate-800 pb-6">
                                        <div className="flex items-center gap-4">
                                            <div className="w-16 h-16 rounded-2xl bg-blue-50 text-primary flex items-center justify-center text-3xl font-black border-2 border-primary">
                                                <i className="fas fa-microscope"></i>
                                            </div>
                                            <div>
                                                <h1 className="text-3xl font-black text-slate-900 leading-tight">{labDetails.name}</h1>
                                                <p className="text-sm font-semibold text-slate-600">{labDetails.nameEn}</p>
                                                <p className="text-xs text-slate-500 mt-1"><i className="fas fa-map-marker-alt ml-1"></i> {labDetails.address} | <i className="fas fa-phone ml-1 mr-2"></i> {labDetails.phone}</p>

                                        </div>
                                        <div className="text-left" dir="ltr">

                                            <div className="mt-2 text-sm text-slate-600">
                                                <p><span className="font-bold text-slate-800">Order ID:</span> {selectedOrder.id}</p>
                                                <p><span className="font-bold text-slate-800">Date:</span> {selectedOrder.date.split(' ')[0]}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex justify-between items-center p-5 bg-slate-50 rounded-2xl border border-slate-200 print:bg-white print:border-slate-300">
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-y-4 gap-x-8 w-full text-sm">
                                            <div>
                                                <span className="text-slate-500 block text-xs font-semibold mb-0.5">اسم المريض / Patient Name</span>
                                                <strong className="text-slate-900 text-base">{pat?.name}</strong>
                                            </div>
                                            <div>
                                                <span className="text-slate-500 block text-xs font-semibold mb-0.5">العمر / Age</span>
                                                <strong className="text-slate-900 text-base">{pat?.age} سنة ({pat?.gender})</strong>
                                            </div>
                                            <div>
                                                <span className="text-slate-500 block text-xs font-semibold mb-0.5">رقم الملف / Patient ID</span>
                                                <strong className="text-primary text-base">{pat?.id}</strong>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="min-h-[400px]">
                                        <table className="w-full text-sm text-left" dir="ltr">
                                            <thead className="border-b-2 border-slate-300 text-slate-700 uppercase text-xs font-black">
                                                <tr>
                                                    <th className="py-3 px-2">Test Name</th>
                                                    <th className="py-3 px-2">Result</th>
                                                    <th className="py-3 px-2">Unit</th>
                                                    <th className="py-3 px-2">Reference Range</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {selectedOrder.tests.map((item, idx) => {
                                                    const meta = tests.find(t => t.id === item.testId);
                                                    return (
                                                        <tr key={item.testId} className={`border-b border-slate-100 print:bg-transparent`}>
                                                            <td className="py-4 px-2 font-bold text-slate-800">{meta ? meta.name : item.testId}</td>
                                                            <td className={`py-4 px-2 text-lg font-black ${item.isAbnormal ? 'text-red-600 print:text-red-600' : 'text-slate-800'}`}>

                                                            </td>
                                                            <td className="py-4 px-2 text-slate-600 font-medium">{meta?.unit}</td>
                                                            <td className="py-4 px-2 text-slate-600">{meta?.normalRange}</td>
                                                        </tr>
                                                    );
                                                })}

                                        </table>

                                    {aiInterpretation && (
                                        <div className="p-6 bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-100 rounded-2xl relative overflow-hidden print:border-slate-300 print:bg-white fade-in mt-8">
                                            <div className="absolute top-0 right-0 w-2 h-full bg-gradient-to-b from-indigo-500 to-purple-500 print:bg-slate-400"></div>
                                            <div className="flex items-center gap-3 text-indigo-800 font-black text-lg mb-3">
                                                <i className="fas fa-robot text-2xl text-indigo-500 print:text-slate-700"></i>
                                                <h4>تفسير مساعد الذكاء الاصطناعي للاسترشاد:</h4>
                                            </div>
                                            <p className="text-sm text-indigo-950 font-medium leading-relaxed whitespace-pre-line print:text-slate-800">{aiInterpretation}</p>
                                        </div>
                                    )}

                                    <div className="pt-16 mt-16 flex justify-between items-end border-t border-slate-200">
                                        <div className="text-center w-48">

                                            <p className="mt-1" dir="ltr">Printed on: {new Date().toLocaleString('en-US', { hour12: false })}</p>
                                        </div>

                                </div>
